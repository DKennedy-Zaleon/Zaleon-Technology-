name: Frontend Build

on:
  push:
    paths:
      - "apps/portal/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/portal/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm install
      - run: npm run build
